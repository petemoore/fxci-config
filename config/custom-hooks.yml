project-relman/code-review-production:
  bindings:
  - exchange: exchange/taskcluster-queue/v1/task-completed
    routingKeyPattern: route.project.relman.codereview.v1.try_ending
  description: '*DO NOT EDIT* - This resource is configured automatically by [ci-admin](https://github.com/mozilla-releng/fxci-config).


    Automatically create code review publication tasks'
  emailOnError: true
  hookGroupId: project-relman
  hookId: code-review-production
  name: Code review hook (production)
  owner: release-mgmt-analysis@mozilla.com
  schedule: []
  task:
    created:
      $fromNow: 0 seconds
    deadline:
      $fromNow: 2 hours
    expires:
      $fromNow: 1 month
    extra: {}
    metadata:
      description: Publish issues detected in remote tasks
      name: Code review publication (production)
      owner: release-mgmt-analysis@mozilla.com
      source: https://github.com/mozilla/code-review
    payload:
      artifacts:
        public/results:
          path: /tmp/results
          type: directory
      cache: {}
      capabilities: {}
      command:
      - code-review-bot
      - --taskcluster-secret
      - project/relman/code-review/runtime-production
      env:
        $merge:
        - $if: firedBy == 'triggerHook'
          else: {}
          then:
            $eval: payload
        - $if: firedBy == 'pulseMessage'
          else: {}
          then:
            TRY_RUN_ID:
              $eval: payload.runId
            TRY_TASK_GROUP_ID:
              $eval: payload.status.taskGroupId
            TRY_TASK_ID:
              $eval: payload.status.taskId
      features:
        taskclusterProxy: true
      image:
        namespace: code-analysis.v2.code-review.branch.production
        path: public/code-review-bot.tar.zst
        type: indexed-image
      maxRunTime: 7200
    priority: lowest
    provisionerId: code-review
    retries: 3
    routes:
    - index.project.relman.production.code-review.latest
    schedulerId: relman
    scopes:
    - secrets:get:project/relman/code-review/runtime-production
    - index:insert-task:project.relman.production.code-review.*
    - notify:email:*
    tags: {}
    workerType: bot-gcp
  triggerSchema:
    additionalProperties: true
    type: object
