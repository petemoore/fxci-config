ash:
  task:
    deadline:
      $fromNow: 30 minutes
    expires:
      $fromNow: 3 days
    extra: {}
    metadata:
      $let:
        description:
          $if: firedBy == "triggerHook"
          else: Fired by ${firedBy}
          then: Fired by triggerHook call from ${clientId}
      in:
        description: ${description}
        name: On-Push task for https://hg.mozilla.org/projects/ash
        owner: mozilla-taskcluster-maintenance@mozilla.com
        source: https://firefox-ci-tc.services.mozilla.com/hooks/hg-push/ash
    payload:
      command:
      - hg-push
      - --repo-url
      - https://hg.mozilla.org/projects/ash
      - --project
      - ash
      - --level
      - '2'
      - --trust-domain
      - comm
      - --repository-type
      - hg
      env:
        PULSE_MESSAGE:
          $json:
            $eval: payload
      features:
        taskclusterProxy: true
      image: mozillareleases/build-decision:d9b4a81d8e114107d174994bf6be3968b34ca0db@sha256:5b1d21483c08c0698dd7f0b41f99482277375de5e5304ada1ad9d927d3899d7d
      maxRunTime: 600
    priority: highest
    provisionerId: infra
    retries: 5
    routes:
    - index.hg-push.v1.ash.revision.${payload.payload.data.heads[0]}
    - index.hg-push.v1.ash.pushlog-id.${payload.payload.data.pushlog_pushes[0].pushid}
    schedulerId: comm-level-2
    scopes:
    - assume:repo:hg.mozilla.org/projects/ash:branch:*
    tags: {}
    workerType: build-decision
  bindings:
  - exchange: exchange/hgpushes/v2
    routingKeyPattern: projects/ash
  description: 'On-push task for repository https://hg.mozilla.org/projects/ash.


    This hook listens to pulse messages from `hg.mozilla.org` and creates

    a task which quickly creates a decision task when such a message arrives.

    '
  triggerSchema:
    additionalProperties: false
    properties:
      _meta: {}
      payload:
        additionalProperties: false
        description: Hg push payload - see https://mozilla-version-control-tools.readthedocs.io/en/latest/hgmo/notifications.html#pulse-notifications.
        properties:
          data:
            additionalProperties: false
            properties:
              heads:
                items:
                - pattern: ^[0-9a-z]{40}$
                  type: string
                type: array
              pushlog_pushes:
                items:
                - additionalProperties: false
                  properties:
                    push_full_json_url:
                      type: string
                    push_json_url:
                      type: string
                    pushid:
                      default: 0
                      type: integer
                    time:
                      default: 0
                      type: integer
                    user:
                      default: nobody@mozilla.com
                      format: email
                      type: string
                  required:
                  - time
                  - pushid
                  - user
                  type: object
                type: array
              repo_url:
                default: https://hg.mozilla.org/projects/ash
                enum:
                - https://hg.mozilla.org/projects/ash
              source: {}
            required:
            - repo_url
            - heads
            - pushlog_pushes
            type: object
          type:
            default: changegroup.1
            enum:
            - changegroup.1
        required:
        - type
        - data
        type: object
    required:
    - payload
    type: object
