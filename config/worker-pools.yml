  description: 'Builds docker images; NOTE: capacity set to 1 instead of 3 to try to avoid [issues with dind](https://bugzilla.mozilla.org/show_bug.cgi?id=1427096)'
  owner: release+tc-workers@mozilla.com
  emailOnError: false
  cloud: gcp
  imageset: docker-firefoxci-gcp-l3-googlecompute-2024-02-05t23-18-22z
  zones:
  - us-central1-a
  - us-central1-b
  - us-central1-c
  - us-central1-f
  - us-west1-a
  - us-west1-b
  machineType: c2-standard-4
  minCapacity: 0
  maxCapacity: 10
  minCpuPlatform: Intel Cascadelake
  disks:
  - autoDelete: true
    boot: true
    initializeParams:
      diskSizeGb: 75
    type: PERSISTENT
  - autoDelete: true
    initializeParams:
      diskType: local-ssd
    interface: NVME
    type: SCRATCH
  scheduling:
    instanceTerminationAction: DELETE
    onHostMaintenance: terminate
    provisioningModel: SPOT
  workerConfig:
    artifacts:
      skipCompressionExtensions:
      - .7z
      - .bz2
      - .deb
      - .dmg
      - .flv
      - .gif
      - .gz
      - .jpeg
      - .jpg
      - .png
      - .swf
      - .tbz
      - .tgz
      - .webp
      - .whl
      - .woff
      - .woff2
      - .xz
      - .zip
      - .zst
      - lz4
    capacity: 1
    deviceManagement:
      hostSharedMemory:
        enabled: false
      kvm:
        enabled: false
    dindImage: taskcluster/dind-service:v4.1
    shutdown:
      afterIdleSeconds: 120
      enabled: true
  lifecycle:
    queueInactivityTimeout: 7200
    registrationTimeout: 1800
    reregistrationTimeout: 345600
