adhoc-1/b-linux-gcp:
  providerId: fxci-level1-gcp
  description: Worker for Firefox automation.
  owner: release+tc-workers@mozilla.com
  emailOnError: true
  cloud: gcp
  imageset: docker-firefoxci-gcp-l1-googlecompute-2024-06-14t19-52-20z
  zones:
  - us-central1-a
  - us-central1-b
  - us-central1-c
  - us-central1-f
  - us-west1-a
  - us-west1-b
  machineType: c2-standard-4
  minCapacity: 0
  maxCapacity: 100
  minCpuPlatform: Intel Cascadelake
  disks:
  - autoDelete: true
    boot: true
    initializeParams:
      diskSizeGb: 20
    type: PERSISTENT
  - autoDelete: true
    initializeParams:
      diskType: local-ssd
    interface: NVME
    type: SCRATCH
  scheduling:
    instanceTerminationAction: DELETE
    onHostMaintenance: terminate
    provisioningModel: SPOT
  workerConfig:
    artifacts:
      skipCompressionExtensions:
      - .7z
      - .bz2
      - .deb
      - .dmg
      - .flv
      - .gif
      - .gz
      - .jpeg
      - .jpg
      - .png
      - .swf
      - .tbz
      - .tgz
      - .webp
      - .whl
      - .woff
      - .woff2
      - .xz
      - .zip
      - .zst
      - lz4
    capacity: 1
    deviceManagement:
      hostSharedMemory:
        enabled: false
      kvm:
        enabled: false
    shutdown:
      afterIdleSeconds: 120
      enabled: true
  lifecycle:
    queueInactivityTimeout: 7200
    registrationTimeout: 1800
    reregistrationTimeout: 345600
